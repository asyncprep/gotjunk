# Crew app on iOS: builds it (unsigned) and runs the device tests on an iPhone simulator.
# iOS can only be built on a Mac; this is how changes made on Windows are checked for iOS.
name: Crew app (iOS)

on:
  push:
    branches: [main]
    paths: ['apps/mobile/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['apps/mobile/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v5
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.4
          channel: stable
          cache: true
      - run: flutter pub get
      # Job logs need a GitHub sign-in to read; error lines are also posted as annotations,
      # which show on the run page and through the API without one.
      - name: Build (no code signing)
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -iE "error|failed|exception" "$RUNNER_TEMP/build.log" | tail -10 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }
      - name: Start an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          print(next(d['udid'] for runtime, ds in sorted(devices.items(), reverse=True) if 'iOS' in runtime
                     for d in ds if d['name'].startswith('iPhone')))")
          xcrun simctl boot "$UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
      - name: Device tests on the simulator
        # One file at a time: on the hosted simulator, relaunching the app for the next file
        # sometimes can't reach the Dart VM in time. A file that can't connect gets one retry;
        # a real test failure is not retried.
        run: |
          set -o pipefail
          failed=0
          for file in integration_test/*_test.dart; do
            for attempt in 1 2; do
              if flutter test "$file" -d "$UDID" 2>&1 | tee "$RUNNER_TEMP/test.log"; then break; fi
              if [ "$attempt" = 1 ] && grep -q "Connecting to the VM Service timed out" "$RUNNER_TEMP/test.log"; then
                echo "::warning::$file could not connect to the simulator; retrying"
                continue
              fi
              grep -iE "error|failed|exception|Expected|Actual" "$RUNNER_TEMP/test.log" | tail -10 | while IFS= read -r line; do echo "::error::$line"; done
              failed=1
              break
            done
          done
          exit $failed
