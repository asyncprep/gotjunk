name: truck_team_os
description: "Truck Team OS – crew app (Montréal 1-800-GOT-JUNK? truck teams)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  image_picker: ^1.2.4
  intl: ^0.20.2
  path: ^1.9.0
  path_provider: ^2.1.6
  powersync: ^2.5.0
  supabase_flutter: ^2.18.3
  timezone: ^0.11.2
  uuid: ^4.6.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/brand/
  generate: true

# Launcher icon: the admin app's truck mark (assets/brand). Regenerate with `dart run flutter_launcher_icons`.
flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon.png
  adaptive_icon_background: "#00539F"
  adaptive_icon_foreground: assets/brand/icon_foreground.png
  min_sdk_android: 21
