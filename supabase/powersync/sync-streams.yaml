# PowerSync Sync Streams for the crew app (deployed to the Development instance).
# Each server primary key is aliased to `id`, which the app's local schema expects.
# Crews receive only the shifts they are on, plus the reference lists they need.
config:
  edition: 3

streams:
  reference:
    auto_subscribe: true
    queries:
      - SELECT truck_id AS id, unit_number FROM truck WHERE active = true
      - SELECT phone_id AS id, label FROM phone WHERE active = true
      - SELECT code AS id, name_fr, name_en, is_cash, active FROM payment_method
      - SELECT reason_id AS id, name_fr, name_en FROM cancellation_reason WHERE active = true
      - SELECT key AS id, value FROM app_setting
      - SELECT site_id AS id, code, name, issues_tickets, requires_ticket_photo, active FROM site
      - SELECT material_type_id AS id, code, name_fr, name_en, active FROM material_type
      - >-
        SELECT rate_config_id AS id, site_id, material_type_id, rate_per_ton, direction, min_billable_kg,
               min_applies_to, effective_from, effective_to, active
        FROM site_rate_config

  me:
    auto_subscribe: true
    queries:
      - SELECT user_id AS id, employee_id, role FROM app_user WHERE user_id = auth.user_id()

  # Source tables keep their own names (an alias would rename the synced table on the phone);
  # only the columns the crew app uses are sent. `m`/`u` are filter joins: my crew rows.
  my_shifts:
    auto_subscribe: true
    queries:
      - >-
        SELECT shift.shift_id AS id, shift.shift_date, shift.status, shift.truck_id, shift.phone_id,
               shift.hours_type, shift.hours_type_confirmed_at, shift.start_time, shift.finish_time,
               shift.total_hours, shift.return_reason, shift.reopen_reason, shift.submitted_at
        FROM shift
        INNER JOIN shift_crew_member m ON m.shift_id = shift.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT shift_crew_member.shift_crew_id AS id, shift_crew_member.shift_id,
               shift_crew_member.employee_id, shift_crew_member.joined_at, shift_crew_member.left_at
        FROM shift_crew_member
        INNER JOIN shift_crew_member m ON m.shift_id = shift_crew_member.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT job.job_id AS id, job.shift_id, job.opportunity_id, job.outcome, job.payment_method_code,
               job.discount_amount, job.revenue_pre_tax, job.revenue_total_incl_tax, job.tip_amount,
               job.cancellation_reason_id, job.completed_at, job.created_at
        FROM job
        INNER JOIN shift_crew_member m ON m.shift_id = job.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT disposal_visit.disposal_visit_id AS id, disposal_visit.shift_id, disposal_visit.site_id,
               disposal_visit.visit_at, disposal_visit.ticket_number, disposal_visit.notes, disposal_visit.created_at
        FROM disposal_visit
        INNER JOIN shift_crew_member m ON m.shift_id = disposal_visit.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT disposal_material_txn.material_txn_id AS id, disposal_material_txn.disposal_visit_id,
               disposal_material_txn.material_type_id, disposal_material_txn.weight_kg,
               disposal_material_txn.rate_per_ton_applied, disposal_material_txn.direction,
               disposal_material_txn.billable_kg, disposal_material_txn.signed_amount, disposal_material_txn.created_at
        FROM disposal_material_txn
        INNER JOIN disposal_visit v ON v.disposal_visit_id = disposal_material_txn.disposal_visit_id
        INNER JOIN shift_crew_member m ON m.shift_id = v.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT cash_submission.cash_submission_id AS id, cash_submission.shift_id,
               cash_submission.counted_cash, cash_submission.created_at
        FROM cash_submission
        INNER JOIN shift_crew_member m ON m.shift_id = cash_submission.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT photo.photo_id AS id, photo.shift_id, photo.photo_kind, photo.entity_type, photo.entity_id,
               photo.storage_path, photo.captured_at, photo.uploaded_at
        FROM photo
        INNER JOIN shift_crew_member m ON m.shift_id = photo.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
      - >-
        SELECT employee.employee_id AS id, employee.full_name
        FROM employee
        INNER JOIN shift_crew_member c ON c.employee_id = employee.employee_id
        INNER JOIN shift_crew_member m ON m.shift_id = c.shift_id
        INNER JOIN app_user u ON u.employee_id = m.employee_id
        WHERE u.user_id = auth.user_id()
